[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "actionwise-data"
version = "0.1.0"
description = "ActionWise readiness indices — RHI, PGI, PRI, ACI — from EU and US preparedness surveys"
requires-python = ">=3.11,<3.13"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "src" pour le paquet `actionwise`, "." pour le paquet `dashboard`, que les
# tests de rendu importent. Sans ".", la suite ne passe que lancee via
# `python -m pytest` depuis la racine (qui ajoute le repertoire courant a
# sys.path) et casse avec le script `pytest`.
pythonpath = ["src", "."]
filterwarnings = ["ignore::DeprecationWarning"]
